.cover{width:960px;height:320px;background:var(--bg-0);position:relative;overflow:hidden;font-family:var(--font-sans)}
.cover svg{position:absolute;inset:0}
.cover h1{position:absolute;left:32px;bottom:64px;margin:0;font-weight:800;font-size:112px;line-height:.95;color:var(--text)}

.b-action{fill:var(--action)}.b-reward{fill:var(--reward)}.b-surface{fill:var(--surface)}.b-info{fill:var(--info)}
