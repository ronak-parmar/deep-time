name: Build debug APK

# Builds Dino Match and packages it as a DEBUG Android APK (not for the Play Store).
# Run it by hand: GitHub > Actions > "Build debug APK" > Run workflow. It also runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME), so we only accept its licences.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies (repo root, npm workspaces)
        run: npm ci

      - name: Run tests (the build stops here if any test fails)
        run: npm test --workspace games/dino-match

      - name: Build the web app
        run: npm run build --workspace games/dino-match

      - name: Add the Android project if it is not in the repo, then sync the web build into it
        working-directory: games/dino-match
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build the debug APK
        working-directory: games/dino-match/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: dino-match-debug-apk
          path: games/dino-match/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub Release with the APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp games/dino-match/android/app/build/outputs/apk/debug/app-debug.apk "dino-match-${TAG}.apk"
          gh release create "$TAG" "dino-match-${TAG}.apk" \
            --title "Dino Match build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Install by sideloading." \
            --target "$GITHUB_SHA"
