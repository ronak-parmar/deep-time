name: Make upload keystore (run once)

# One-off: makes the Android upload keystore for you (no Java needed on your PC). See tools/make-keystore.md (Option B).
# Before running, add the secrets ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD (same value) and ANDROID_KEY_ALIAS (upload).
# Nothing secret is printed: the log shows only the certificate fingerprints. The keystore is password-protected and the
# artifact is kept for 1 day. Download it, add ANDROID_KEYSTORE_BASE64, back it up, then delete the run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    environment: release
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
      ALREADY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the secrets
        run: |
          if [ "$ALREADY" = "true" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 already exists. Not making a new key (it would replace your upload key)."; exit 1; fi
          if [ ${#KS_PASS} -lt 8 ]; then echo "::error::Add the secret ANDROID_KEYSTORE_PASSWORD first (8 or more characters)."; exit 1; fi

      - name: Make the keystore
        run: |
          mkdir -p out
          keytool -genkeypair -keystore out/upload.jks -storetype PKCS12 -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dino Match" \
            -storepass:env KS_PASS -keypass:env KS_PASS
          base64 -w0 out/upload.jks > out/upload.jks.base64.txt
          echo "Register this SHA-1 in Play Console (Play Games Services > Configuration > Credentials > Android):"
          keytool -list -v -keystore out/upload.jks -storepass:env KS_PASS | grep -E 'Alias name|SHA1:|SHA256:'

      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: out/
          if-no-files-found: error
          retention-days: 1
