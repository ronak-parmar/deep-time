// Android library module for the local Capacitor plugin "capacitor-play-games".
// `npx cap sync android` adds it to the generated android/ project (capacitor.settings.gradle).
// Versions follow the Capacitor 8 app's variables.gradle when present (rootProject.ext), with Capacitor 8 defaults.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.ronki.playgames"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // 20.1.2 is the version the cloud-save code was written and tested against; it also runs on Capacitor 8 (minSdk 24, SDK 36).
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
}
