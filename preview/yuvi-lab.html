<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuvi lab</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#2a2118;color:#f5e9d3;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:16px 0 4px;font-size:22px}.sub{opacity:.7;font-size:13px;margin-bottom:10px}
#stage{position:relative;width:min(92vw,440px);height:min(92vw,440px);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#stage.light{background:#f4ecdc}#stage.dark{background:#1c2430}#stage.game{background:radial-gradient(ellipse at 50% 88%,#7fb069 0,#4d8a4a 30%,transparent 31%),linear-gradient(#bfe3ff,#e8d9ff 75%)}
#shadow{position:absolute;left:50%;bottom:9%;width:130px;height:18px;margin-left:-65px;border-radius:50%;background:rgba(0,0,0,.2)}
#yuvi{position:absolute;left:50%;bottom:9%;width:360px;height:350px;margin-left:-180px;transform-origin:50% 97%}
#yuvi img{position:absolute;inset:0;width:100%;height:100%;opacity:0}#yuvi img.on{opacity:1}
#bubble{position:absolute;left:50%;top:5%;transform:translateX(-50%) scale(0);background:#fff8e8;color:#4a3420;border:3px solid #8b5a2b;border-radius:16px;padding:7px 14px;font-weight:700;font-size:15px;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}#bubble.on{transform:translateX(-50%) scale(1)}
.fx{position:absolute;pointer-events:none}.sp{width:10px;height:10px;background:#ffd84a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}.chip{width:8px;height:6px;background:#8d8a86;border-radius:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:470px;margin:14px 10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 14px;background:linear-gradient(#f7c95a,#d99a26);color:#4a2c0c;box-shadow:0 3px 0 #8b5a1b;cursor:pointer}button:active{transform:translateY(2px)}button.on{background:linear-gradient(#9fe08a,#5aa845);box-shadow:0 3px 0 #2f6a24}.row2 button{background:linear-gradient(#d9cbb4,#a8957a);box-shadow:0 3px 0 #6d5c45}
.note{font-size:12px;opacity:.6;max-width:440px;text-align:center;margin:0 12px 20px}</style></head><body>

<div class="btns" id="acts"></div>
<div class="btns row2"><button data-bg="game">Game bg</button><button data-bg="light">Light</button><button data-bg="dark">Dark</button><button id="slow">Slow-mo: off</button></div>
<div class="note">Each action uses its own drawn pose; code adds the bounce, sway, hops and effects.</div>
<script>
const S=Math.sin,PI=Math.PI,el=id=>document.getElementById(id);
const ACT={
 idle:{f:'idle',m:t=>({y:-2*Math.abs(S(t*2.2)),sy:1+.015*S(t*4.4),r:.8*S(t*1.1)})},
 talk:{f:t=>(Math.floor(t*5)%2?'talk':'idle'),m:t=>({y:-2*Math.abs(S(t*5)),r:1.5*S(t*2.5)}),b:"Hi! I'm Yuvi, your dig buddy!"},
 wave:{f:'wave',m:t=>({r:3*S(t*7),y:-2*Math.abs(S(t*3.5))}),b:'Hello!'},
 point:{f:'point',m:t=>({x:6*Math.abs(S(t*3)),r:2}),b:'Over here!'},
 cheer:{f:'cheer',m:t=>{const c=(t%.8)/.8,h=Math.max(0,S(c*PI));return{y:-60*h,sy:1+.06*h-(c<.06||c>.94?.1:0),sx:1-.04*h+(c<.06||c>.94?.08:0)}},b:'Yay!',spark:1},
 think:{f:'think',m:t=>({r:-3+1.5*S(t*1.4),y:-1.5*Math.abs(S(t*1.4))}),b:'Hmm...'},
 dig:{f:'dig',m:t=>{const c=(t%.9)/.9;const r=c<.5?6*(c/.5):6-16*Math.min(1,(c-.5)/.15);return{r:c>.65?-10+10*((c-.65)/.35):r,y:c>.62&&c<.72?3:0}},chips:1},
 sad:{f:'sad',m:t=>({y:2+1.5*S(t*1.2),sy:.98,sx:1.02,r:-1}),b:'Oh no...',tint:1},
 surprised:{f:'surprised',m:t=>{const c=(t%1.6)/1.6,h=c<.3?S(c/.3*PI):0;return{y:-40*h,sy:c<.04?.9:1+.06*h,sx:c<.04?1.08:1}},b:'!?'},
 walk:{f:'idle',m:t=>{const w=S(t*8),cyc=(t%6)/6,x=cyc<.5?-260+cyc*1040:260-(cyc-.5)*1040;return{x,y:-6*Math.abs(w),r:4*w,flip:cyc>=.5}}},
};
const ORDER=Object.keys(ACT);let cur='idle',t0=performance.now(),all=false,ai=0,slow=1;
ORDER.forEach(a=>{const b=document.createElement('button');b.textContent=a[0].toUpperCase()+a.slice(1);b.dataset.a=a;b.onclick=()=>{all=false;play(a)};el('acts').appendChild(b)});
const pb=document.createElement('button');pb.textContent='▶ Play all';pb.onclick=()=>{all=true;ai=0;play(ORDER[0])};el('acts').appendChild(pb);
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>el('stage').className=b.dataset.bg);
el('slow').onclick=()=>{slow=slow===1?.35:1;el('slow').textContent='Slow-mo: '+(slow===1?'off':'on')};
let pop=0;
function play(a){cur=a;t0=performance.now();pop=performance.now();document.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('on',b.dataset.a===a));const bb=el('bubble');bb.classList.remove('on');if(ACT[a].b){setTimeout(()=>{bb.textContent=ACT[a].b;bb.classList.add('on')},150)}}
function frame(now){const t=(now-t0)/1000*slow;if(all&&t>4){ai=(ai+1)%ORDER.length;play(ORDER[ai])}
 const A=ACT[cur],f=typeof A.f==='function'?A.f(t):A.f;document.querySelectorAll('#yuvi img').forEach(i=>i.classList.toggle('on',i.dataset.f===f));
 const m=A.m(t);const p=Math.min(1,(now-pop)/140);const ps=1+.08*S(p*PI);
 el('yuvi').style.transform=`translate(${m.x||0}px,${m.y||0}px) rotate(${m.r||0}deg) scale(${(m.sx||1)*(m.flip?-1:1)*ps},${(m.sy||1)/ps})`;
 el('yuvi').style.filter=A.tint?'saturate(.7) brightness(.95)':'none';
 el('shadow').style.transform=`translateX(${m.x||0}px) scale(${1+(m.y||0)/180})`;
 if(A.spark&&Math.random()<.3)fx('sp',0,-250,1);if(A.chips){const c=((now-t0)/1000*slow%.9)/.9;if(c>.64&&c<.7)for(let i=0;i<3;i++)fx('chip',110,-20,0)}
 requestAnimationFrame(frame)}
function fx(cls,ox,oy,float){const s=document.createElement('div');s.className='fx '+cls;const st=el('stage'),W=st.clientWidth,H=st.clientHeight;let x=W/2+ox+(Math.random()-.5)*(float?220:30),y=H*.9+oy,vx=(Math.random()-.5)*(float?30:200),vy=float?-40:-180-Math.random()*100,l=0;st.appendChild(s);(function step(){l+=.016;if(!float)vy+=700*.016;x+=vx*.016;y+=vy*.016;s.style.left=x+'px';s.style.top=y+'px';s.style.opacity=1-l/.8;l<.8?requestAnimationFrame(step):s.remove()})()}
play('idle');requestAnimationFrame(frame);
</script></body></html>
